{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Story - WriteSphere</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1>WriteSphere</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/profile">Profile</a>
        </nav>
    </header>

    <main class="create-post">
        <h2>Write Your Story</h2>
        <p>Share your thoughts and ideas with the world.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="title">Story Title</label>
            <input type="text" id="title" name="title"
                   placeholder="Enter your story title" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Technology">Technology</option>
                <option value="Education">Education</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Travel">Travel</option>
                <option value="Other">Other</option>
            </select>

            <label for="cover_image">Cover Image</label>
            <input type="file" id="cover_image" name="myfile"
                   accept="image/*">

            <label for="content">Your Story</label>
            <textarea id="content" name="content" rows="10"
                      placeholder="Write your story here..."
                      required></textarea>

            <button type="submit">Publish Story</button>
        </form>
    </main>

</body>
</html>
