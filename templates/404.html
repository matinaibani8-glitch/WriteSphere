<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | WriteSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: 120px;
            color: #4f46e5;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>

        <p>
            The page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
