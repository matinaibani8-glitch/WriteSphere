<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | WriteSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff7ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: 110px;
            color: #ea580c;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background: #ea580c;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            background: #c2410c;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>

        <p>
            Something went wrong on our server.
            Please try again later.
        </p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
